<html lang="en" class="dark">

    <meta charset="UTF-8" />

  <body class="bg-[#0f0f14] text-zinc-100 font-sans antialiased selection:bg-amber-500/20 selection:text-amber-200 min-h-screen">
    <div id="root">
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background-color:#0f0f14;">
        <div style="text-align:center;">
          <div style="width:40px; height:40px; border:3px solid rgba(245,158,11,0.2); border-top-color:#f59e0b; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
