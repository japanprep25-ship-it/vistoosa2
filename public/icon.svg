<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Metallic Black / Dark Chrome Shading -->
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2f" />
      <stop offset="50%" stop-color="#1a1a1d" />
      <stop offset="100%" stop-color="#101012" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3d44" />
      <stop offset="100%" stop-color="#1c1c1f" />
    </linearGradient>

    <linearGradient id="facetDeep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>

    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="grooveInner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Clean App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="2" stroke-opacity="0.5" />

  <!-- The Vistoosa 3D Sculptural Geometric V Logo -->
  <g filter="url(#shadowDepth)">
    <!-- 1. Upper Left Wing: Facet with S-Curve Channel -->
    <!-- Top-left wedge -->
    <path d="M 134 138 L 204 138 L 164 190 L 134 190 Z" fill="url(#facetHighlight)" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Main Left Wing with Engraved Organic S-Curve Groove -->
    <path d="M 163 195 L 238 212 L 198 255 L 163 195 Z" fill="url(#facetDark)" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 198 255 L 256 260 L 256 270 L 202 270 Z" fill="url(#facetDeep)" stroke="#27272a" stroke-width="1.5" />
    
    <!-- Flowing S-groove engraved on left arm -->
    <path d="M 168 155 Q 185 175 175 200 T 225 240 L 235 255" fill="none" stroke="#09090b" stroke-width="8" stroke-linecap="round" filter="url(#grooveInner)" />
    <path d="M 168 155 Q 185 175 175 200 T 225 240 L 235 255" fill="none" stroke="#d97706" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- 2. Upper Right Wing: Geometric Block with Engraved Circle Disc -->
    <path d="M 308 138 L 382 138 L 328 238 L 274 238 Z" fill="url(#facetDark)" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Engraved Outer Ring and Inner Circle Disc (The 'O' mark) -->
    <circle cx="330" cy="175" r="28" fill="#121215" stroke="#0a0a0c" stroke-width="5" filter="url(#grooveInner)" />
    <circle cx="330" cy="175" r="28" fill="none" stroke="#3f3f46" stroke-width="2" />
    <circle cx="330" cy="175" r="16" fill="url(#facetHighlight)" stroke="#27272a" stroke-width="1.5" />

    <!-- Cutaway bevel step below circle on right wing -->
    <path d="M 274 238 L 328 238 L 312 265 L 268 265 Z" fill="url(#facetDeep)" stroke="#27272a" stroke-width="1.5" />

    <!-- 3. Center Notch Connector -->
    <path d="M 256 245 L 272 265 L 256 276 L 240 265 Z" fill="url(#facetHighlight)" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Horizontal separation slit gap -->
    
    <!-- 4. Lower Section: Split Vertical Triangular Wedges forming sharp Apex -->
    <!-- Left Bottom Wedge -->
    <path d="M 200 282 L 253 282 L 253 388 Z" fill="url(#facetDark)" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 200 282 L 253 388 L 251 388 L 198 282 Z" fill="#18181b" />

    <!-- Right Bottom Wedge -->
    <path d="M 259 282 L 312 282 L 259 388 Z" fill="url(#facetDeep)" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 259 282 L 312 282 L 310 285 L 261 285 Z" fill="url(#facetHighlight)" />
  </g>

  <!-- Premium Brand Text Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#f4f4f5">VISTOOSA</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="4" fill="#a1a1aa">MANAGEMENT SYSTEM</text>
</svg>
