<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#27272a" stroke-width="2" />
  
  <!-- Stylized Sartorial V Monogram -->
  <g transform="translate(256, 256) scale(0.88) translate(-256, -256)">
    <!-- Shadow / Ambient Glow -->
    <path d="M 120 120 L 256 390 L 392 120 L 332 120 L 256 280 L 180 120 Z" fill="#ca8a04" opacity="0.25" filter="url(#glow)"/>
    
    <!-- Left Wing (Sartorial Lapel Cut) -->
    <path d="M 110 130 L 256 400 L 216 400 L 90 150 Z" fill="url(#goldGrad)" />
    
    <!-- Right Wing (Sharp geometric lapel) -->
    <path d="M 402 130 L 256 400 L 296 400 L 422 150 Z" fill="url(#silverGrad)" />
    
    <!-- Center Inset V -->
    <path d="M 165 140 L 256 320 L 347 140 L 310 140 L 256 248 L 202 140 Z" fill="url(#goldGrad)" />

    <!-- Sartorial Tie / Crest diamond -->
    <polygon points="256,170 270,195 256,220 242,195" fill="#ffffff" opacity="0.9" />

    <!-- Typography "VISTOOSA" underneath -->
    <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="10" fill="#f4f4f5">VISTOOSA</text>
    <text x="256" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#a1a1aa">HAUTE COUTURE</text>
  </g>
</svg>
